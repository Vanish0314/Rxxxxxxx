name: Generate README on tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  generate-doc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore and Build
        run: |
          dotnet --info
          dotnet restore
          dotnet build -c Release --nologo

      - name: Run program with 10s timeout and capture output
        id: runapp
        shell: bash
        run: |
          set -euo pipefail
          # Try to run the executable for up to 10 seconds
          echo "Running application for up to 10 seconds to capture output..."
          # Prefer running the specific project if present
          if [[ -f "Rxxxxxxx.csproj" ]]; then
            timeout 10s dotnet run --project Rxxxxxxx.csproj -c Release --no-build > app_output.txt 2>&1 || true
          else
            # Fallback: try running from solution
            timeout 10s dotnet run -c Release --no-build > app_output.txt 2>&1 || true
          fi
          echo "---BEGIN-OUTPUT---"
          cat app_output.txt | sed -e 's/\r$//'
          echo "---END-OUTPUT---"

      - name: Append section to README.md
        id: updatereadme
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Preparing README update for tag: ${TAG_NAME}"

          PROGRAM_CS_CONTENT=$(cat Program.cs | sed -e 's/\\/\\\\/g')
          APP_OUTPUT=$(cat app_output.txt | sed -e 's/\\/\\\\/g')

          {
            echo "";
            echo "## Tag";
            echo "";
            echo "### 示例代码";
            echo "···";
            echo "${PROGRAM_CS_CONTENT}";
            echo "···";
            echo "";
            echo "### 输出";
            echo "···";
            echo "${APP_OUTPUT}";
            echo "···";
          } >> README.md

          echo "README.md updated.";

      - name: Commit and push README update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs: append tag section for ${GITHUB_REF_NAME}"
          # Push to the default branch that contains the tag's commit
          DEFAULT_BRANCH=$(git remote show origin | sed -n "/HEAD branch/s/.*: //p")
          echo "Pushing README update to ${DEFAULT_BRANCH}"
          git push origin HEAD:${DEFAULT_BRANCH}


